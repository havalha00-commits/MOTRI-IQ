# Gradle memory settings for low-memory machines
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Duser.language=en -Duser.country=US
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configureondemand=true

# System properties for consistent locale in build tools (fixes Arabic-Indic digit issue in AAB)
systemProp.user.language=en
systemProp.user.country=US
systemProp.user.variant=

# Kotlin daemon memory
kotlin.daemon.jvm.options=-Xmx512m -XX:MaxMetaspaceSize=192m -XX:-UseParallelGC -Duser.language=en -Duser.country=US
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
